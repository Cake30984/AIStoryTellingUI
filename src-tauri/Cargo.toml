[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# unsafe-headers: 呼び出し側から Origin ヘッダを指定できるようにする。plugin-http は既定で
# WebView の origin を Origin として必ず付与するが、ComfyUI は通常起動だと origin_only_middleware
# で「Origin のホスト名 != Host」を 403 で落とすため、Origin を外せる必要がある（platform.ts の omitOrigin）。
tauri-plugin-http = { version = "2.5.9", features = ["unsafe-headers"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# R3: API キーを OS の資格情報ストアへ分離（平文 state.json に置かない）
keyring = { version = "3.6", features = ["windows-native"] }
